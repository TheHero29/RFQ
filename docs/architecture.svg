<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">British RFQ architecture</title><desc id="desc">A React browser app calls FastAPI running on Uvicorn. Pydantic validates requests. Validation, ranking, and extension rules write to SQLite in one transaction. SQLite stores RFQs, quotes, and events. The browser polls every five seconds.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#087f71" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="420" rx="16" fill="#f4f7f8"/>
<g font-family="Arial,sans-serif" fill="#162f36"><text x="40" y="48" font-size="24" font-weight="700">British RFQ · simple by design</text><text x="40" y="78" font-size="15" fill="#61757c">One server. One database. An atomic decision for every bid.</text>
<rect x="40" y="135" width="240" height="175" rx="12" fill="#fff" stroke="#cbd8db"/><text x="62" y="170" font-size="20" font-weight="700">React frontend</text><text x="62" y="202" font-size="15">React / JSX / CSS</text><text x="62" y="230" font-size="15">RFQs, quotes, rankings</text><text x="62" y="258" font-size="15">Activity + countdowns</text><text x="62" y="287" font-size="13" fill="#61757c">Polls every 5 seconds</text>
<rect x="400" y="125" width="300" height="195" rx="12" fill="#e5f5ef" stroke="#99cbb9"/><text x="424" y="162" font-size="20" font-weight="700">FastAPI / Uvicorn</text><text x="424" y="194" font-size="15">Static files + JSON API</text><text x="424" y="224" font-size="15">Pydantic request models</text><text x="424" y="251" font-size="15">Supplier rankings</text><text x="424" y="278" font-size="15">Extension + forced-close rules</text><text x="424" y="302" font-size="13" fill="#48796a">backend/app · typed routes + docs</text>
<rect x="820" y="135" width="240" height="175" rx="12" fill="#fff" stroke="#cbd8db"/><text x="844" y="170" font-size="20" font-weight="700">SQLite</text><text x="844" y="204" font-size="15">RFQs + configuration</text><text x="844" y="233" font-size="15">Quotes + revisions</text><text x="844" y="262" font-size="15">Activity events</text><text x="844" y="289" font-size="13" fill="#61757c">Durable local storage</text>
<g stroke="#087f71" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M288 208H390"/><path d="M708 208H810"/></g><text x="306" y="190" font-size="13" fill="#61757c">HTTP</text><text x="721" y="190" font-size="13" fill="#61757c">SQL</text>
<text x="550" y="367" text-anchor="middle" font-size="14" fill="#61757c">Bid + ranking check + deadline update + activity log commit in one transaction.</text></g></svg>
